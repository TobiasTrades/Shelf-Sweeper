<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelf Sweeper</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelf Sweeper">
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Mulish:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app with three views (Scan viewfinder, Shelves history, Receipt log), an item card that opens over any of them, and a camera dock fixed at the bottom.
   Look: "Appraiser", one deliberate dark look: navy ground, gold for value, ivory text, serif figures, items as numbered lots. */
:root{
  --bg:#0f1b2d; --soft:#16263d; --line:#23344f; --ink:#f3ead8; --muted:#8a97ab;
  --accent:#d4a64a; --accent-ink:#0f1b2d; --accent-soft:rgba(212,166,74,.14);
  --good:#8fc4a0; --good-soft:rgba(143,196,160,.14); --steady:#d9b26a; --steady-soft:rgba(217,178,106,.14);
  --check:#a9c3df; --check-soft:rgba(169,195,223,.13); --bad:#e08a7e; --bad-soft:rgba(224,138,126,.13);
  --stage:#0b1524; --stage-2:#1a2a40; --paper:#f3ead8; --paper-edge:#0b1524;
  --shadow:0 14px 36px rgba(0,0,0,.55);
  --f-ui:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;margin:0 auto}
.muted{color:var(--muted)}

/* ---------- header ---------- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
header.bar .wrap{padding-block:10px;display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:0 0 auto}
.logo svg{width:16px;height:16px}
.top h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.top .sp{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);border:0;border-radius:999px;padding:5px 10px}
.status.busy{color:var(--check);background:var(--check-soft)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 6px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tabs small{font-weight:600;opacity:.75}



/* ---------- scan view ---------- */
.stage{background:var(--stage);color:#fff}
.stage .wrap{padding-block:12px 12px;display:grid;gap:10px}
.stage-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:0}
.pill.strong{background:#fff;color:#121815}
.stage-top .sp{flex:1}
.frame{position:relative;margin:0 auto;width:min(100%, calc(50vh * var(--ar,1.333)));aspect-ratio:var(--ar,1.333);max-width:100%;border-radius:14px;overflow:hidden;background:var(--stage-2)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:999px;padding:5px 10px;font-weight:800;font-size:13px;background:#fff;color:#121815;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;z-index:2}
.pin.hit{background:#0b7a52;color:#fff}
.pin.check{background:#fff1dc;color:#8a4f00}
.pin.grab{background:#121815;color:#fff}
.pin.pass{opacity:.55}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:1px;z-index:-1}
.scanning{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);font-weight:700;font-size:14px;gap:8px;z-index:3;text-align:center;padding:16px}
.scanning .spin{width:22px;height:22px;border-width:3px}
.scanning button{border:0;background:#fff;color:#121815;border-radius:10px;padding:8px 14px;font-weight:800}
.stage-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:rgba(255,255,255,.75);font-weight:600}
.stage-nav button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12.5px}
.stage-nav button:disabled{opacity:.3;cursor:default}
.empty-stage{display:grid;place-items:center;text-align:center;gap:10px;padding:32px 16px;color:rgba(255,255,255,.85)}
.empty-stage b{font-size:18px;color:#fff}
.empty-stage svg{width:42px;height:42px;opacity:.8}

.shelf{padding-block:14px 0;display:grid;gap:10px}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.shelf-head .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.shelf-head .big{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.shelf-head .right{text-align:right;font-size:12.5px;color:var(--muted)}
.shelf-head .right b{color:var(--ink)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.note strong{color:var(--ink)}
.issue{background:var(--check-soft);color:var(--check);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}

.rows{display:grid}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--line)}
.dot.hit{background:var(--accent)} .dot.check{background:var(--check)} .dot.grab{background:var(--ink)}
.row h3{margin:0;font-size:14.5px;font-weight:700;line-height:1.3}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.row .sub.warn{color:var(--check);font-weight:700}
.row .price{text-align:right}
.row .price b{display:block;font-size:17px;font-weight:800}
.row.hit .price b{color:var(--accent)}
.row .price small{font-size:11.5px;color:var(--muted);font-weight:700}
.row.passed h3,.row.passed .price b{color:var(--muted);text-decoration:line-through}

.demand{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.demand b{font-weight:800}
.meter{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:0 0 auto;display:inline-block}
.meter i{display:block;height:5px;border-radius:3px}
.fast b,.fast .g{color:var(--accent)} .fast .meter i,.fast i.fill{background:var(--accent)}
.steady b,.steady .g{color:var(--check)} .steady .meter i,.steady i.fill{background:var(--check)}
.slow b,.slow .g{color:var(--bad)} .slow .meter i,.slow i.fill{background:var(--bad)}
.realtag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px}

/* ---------- shelves view ---------- */
.list-head{padding-block:16px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.list-head .big{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.list-head .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.list-head .right{text-align:right;font-size:12.5px;color:var(--muted)}
.cards{display:grid;gap:12px;padding-block:12px}
.scard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.scard.alerted{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard-head{display:flex;gap:12px;align-items:center;border:0;background:transparent;padding:0;text-align:left;width:100%}
.mini{width:58px;height:58px;border-radius:10px;overflow:hidden;position:relative;background:var(--stage-2);flex:0 0 auto}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini .kind{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:9px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.04em;z-index:2}
.scard-head .t{flex:1;min-width:0}
.scard-head h3{margin:0;font-size:15px;font-weight:800}
.scard-head .m{font-size:12.5px;color:var(--muted)}
.scard-head .v{font-size:18px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--soft);color:var(--ink);font-size:12.5px;font-weight:700;padding:5px 9px;border-radius:8px;text-align:left}
.chip.hit{background:var(--accent);color:var(--accent-ink)}
.chip.grab{background:var(--ink);color:var(--bg)}
.chip.check{background:var(--check-soft);color:var(--check)}
.chip.pass{color:var(--muted);text-decoration:line-through}
.chip .p{opacity:.8;font-weight:600}
.goback{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700}
.goback span{flex:1;min-width:0}
.goback a{font-weight:800;text-decoration:none}
.scard .err{display:flex;align-items:center;gap:8px;color:var(--bad);font-size:13px;font-weight:700}
.scard .err button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-weight:700;font-size:12.5px;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}

/* ---------- receipt view ---------- */
.rcontrols{display:flex;gap:8px;align-items:center;padding-block:14px 0}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;flex:1}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:6px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;font-size:12.5px;font-weight:700}
.paper-wrap{background:var(--paper-edge);border-radius:14px;padding:14px;margin-block:12px}
.paper{background:var(--paper);border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:18px 16px;font-family:var(--f-mono);font-size:13px;display:grid;gap:3px}
.paper .c{text-align:center}
.paper .h1{font-weight:700;font-size:15px;letter-spacing:.14em}
.paper .sub{color:var(--muted);font-size:11.5px;text-align:center}
.paper hr{border:0;border-top:1px dashed var(--muted);opacity:.6;margin:8px 0 6px;width:100%}
.paper .sec{display:grid;grid-template-columns:minmax(0,1fr) 42px 52px;gap:6px;font-weight:700;font-size:11.5px;letter-spacing:.08em}
.paper .sec span:not(:first-child){text-align:right}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 42px 52px;gap:6px;border:0;background:transparent;padding:3px 0;text-align:left;font:inherit;color:inherit;width:100%;border-radius:4px}
.rline:hover{background:var(--soft)}
.rline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rline span:not(:first-child){text-align:right}
.rline.hit{color:var(--accent);font-weight:700}
.rline.check .n{color:var(--check)}
.rline.passed .n{color:var(--muted)}
.rline .s.fast{color:var(--accent);font-weight:700} .rline .s.steady{color:var(--check);font-weight:700} .rline .s.slow{color:var(--bad);font-weight:700}
.tline{display:flex;gap:8px}
.tline span:first-child{flex:1}
.tline.b{font-weight:700}
.tline.miss{font-weight:700;color:var(--accent);font-size:15px;margin-top:2px}
.tline.m{color:var(--muted)}
.paper .legend{color:var(--muted);font-size:11px;text-align:center;margin-top:8px}
.paper .none{color:var(--muted);padding:2px 0}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:10px;gap:12px}
.dock .vid{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.dock .vid svg{width:22px;height:22px}
.dock .shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--accent-soft);background:var(--accent);box-sizing:border-box;display:grid;place-items:center;color:var(--accent-ink)}
.dock .shutter svg{width:26px;height:26px}
.dock .done{height:54px;min-width:54px;padding:0 18px;border-radius:27px;border:1px solid var(--ink);background:var(--bg);font-weight:800;font-size:15px}
.dock label{cursor:pointer}
.hiddenfile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---------- item card (swipe deck) ---------- */
.detail{position:fixed;inset:0;z-index:20;background:var(--soft);overflow-y:auto;overscroll-behavior:contain}
.detail .wrap{padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px}
.dtop{display:flex;align-items:center;gap:10px}
.dtop .back{border:0;background:transparent;color:var(--accent);font-weight:800;padding:6px 0;font-size:14px}
.dtop .count{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.progress{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:4px;background:var(--accent);border-radius:2px}
.deckwrap{position:relative}
.ghost{position:absolute;left:12px;right:12px;top:10px;bottom:-8px;background:var(--bg);border-radius:22px;border:1px solid var(--line);opacity:.6}
.dcard{position:relative;background:var(--bg);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y;transition:transform .2s ease;user-select:none}
.dcard.dragging{transition:none}
.zoom{position:relative;height:230px;overflow:hidden;background:var(--stage-2)}
.zoom .zin{position:absolute;left:50%;top:50%;width:100%}
.zoom .zin img{width:100%;display:block}
.zoom .ztag{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.zoom .ztag span{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.zoom .ztag span.hit{background:#0b7a52}
.zoom .ztag span.check{background:#fff1dc;color:#8a4f00}
.zoom .ztag span.grab{background:#fff;color:#121815}
.zoom .ztag span.fake{background:#b3261e}
.stamp{position:absolute;top:22px;z-index:4;font-weight:800;font-size:22px;letter-spacing:.08em;border:3px solid currentColor;border-radius:10px;padding:4px 12px;opacity:0;pointer-events:none;background:rgba(255,255,255,.9)}
.stamp.grab{left:18px;color:#0b7a52;transform:rotate(-10deg)}
.stamp.pass{right:18px;color:#b3261e;transform:rotate(10deg)}
.dbody{padding:16px 18px 18px;display:grid;gap:12px}
.dname{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dname h2{margin:0;font-size:20px;font-weight:800;line-height:1.2;text-wrap:balance}
.dname .amt{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.dname .amt.hit{color:var(--accent)}
.dmeta{font-size:13px;color:var(--muted);margin-top:-6px}
.odds{border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--soft)}
.odds.fast{background:var(--accent-soft)} .odds.steady{background:var(--check-soft)} .odds.slow{background:var(--bad-soft)}
.odds .ohead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.odds .ohead span{font-size:13px;font-weight:700}
.odds .ohead b{font-size:24px;font-weight:800}
.odds .bar{height:8px;border-radius:4px;background:rgba(127,127,127,.22);overflow:hidden}
.odds .bar i{display:block;height:8px;border-radius:4px}
.odds .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.odds .stats b{display:block;font-size:15px;color:var(--ink);font-weight:800}
.odds .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.odds .foot button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.counts-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.counts-form label{font-weight:700}
.counts-form input{width:4.6em;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--bg);font-weight:700;color:var(--ink)}
.flag{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 12px;font-size:13px;background:var(--check-soft);color:var(--check);flex-wrap:wrap}
.flag p{margin:0;flex:1;min-width:0;font-weight:600}
.flag b{font-weight:800}
.flag button{border:0;border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:800;background:var(--check);color:var(--bg)}
.flag button.plain{background:transparent;color:var(--check);padding:7px 4px}
.flag.dup{background:var(--soft);color:var(--ink)}
.flag.dup button{background:var(--ink);color:var(--bg)}
.flag.dup button.plain{background:transparent;color:var(--muted)}
.vnote{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.vnote.fake{border-left-color:var(--bad)}
.vnote b{color:var(--ink)}
.dlinks{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dlinks a,.dlinks .tagin{font-size:13px;font-weight:800;border-radius:10px;padding:8px 12px;text-decoration:none;border:1px solid var(--line);background:var(--bg);display:inline-flex;align-items:center;gap:4px}
.dlinks a.sold{background:var(--accent-soft);border-color:var(--accent-soft)}
.dlinks a.forsale{color:var(--ink)}
.tagin{color:var(--muted)}
.tagin input{width:3.6em;border:0;background:transparent;padding:0;font-weight:800;color:var(--ink)}
.net{font-size:13px;font-weight:800}
.net.pos{color:var(--accent)} .net.neg{color:var(--bad)}
.dacts{display:flex;align-items:center;justify-content:center;gap:22px;padding-top:4px}
.dacts button{border-radius:50%;display:grid;place-items:center;border:0}
.dacts .pass{width:62px;height:62px;background:var(--bg);color:var(--bad);border:1px solid var(--line);box-shadow:0 6px 16px rgba(18,24,21,.08)}
.dacts .ver{width:50px;height:50px;background:var(--check-soft);color:var(--check)}
.dacts .grab{width:62px;height:62px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(11,122,82,.3)}
.dacts .on{outline:3px solid var(--ink);outline-offset:2px}
.dacts svg{width:26px;height:26px}
.dhint{text-align:center;font-size:12px;color:var(--muted)}

  let S = load();

  function prompt(n, known = []){

    return `You are pricing items for a reseller. ${src}
Identify every distinct item that could be resold (up to 30). Treat a matching set (e.g. 4 identical plates) as one item with the count in the name.
For each, estimate what it typically SELLS for on eBay in used condition (recent sold listings, not asking prices), in US dollars, as a low/typical/high range. Be realistic and conservative. Read any visible maker marks, brands, pattern names or labels and use them. If you can't identify it well, give a generic name, a wide range and confidence "low".
SKIP anything that typically sells for under $${S.min}. Do not list it at all.
POSITION: "x" and "y" are the item's center as a percent of the image width and height (0-100, 0 = left/top), so a price tag can be pinned on it.${n > 1 ? ` "frame" is the 0-based index of the frame where the item is seen best; x and y refer to that frame.` : ""}
Give the best eBay search phrase for sold comps, and "where" in plain words so the shopper can find it ("top shelf, second from left").
DEMAND: "listed" = roughly how many comparable listings are for sale on eBay right now (a round number); "sell_through" = the chance in percent (0-100) that one listed at the typical price sells within about 90 days, i.e. sold ÷ (sold + still listed). Common items with hundreds sitting are low (under 25); sought-after items with few listings are high (60+).

Reply with only JSON in this shape:
{"scene":"China cabinet","photo_issue":null,"items":[{"name":"Lenox Holiday dinner plates, set of 4","details":"maker, pattern, size, visible condition","where":"top shelf, middle","x":50,"y":26,${n > 1 ? '"frame":0,' : ""}"low":70,"typical":110,"high":140,"confidence":"high","ebay_query":"Lenox Holiday dinner plates set of 4","listed":150,"sell_through":48,"verify":null}]}

  function verifyPrompt(it){

${JSON.stringify(was)}
The attached image(s) are close-ups the shopper just took of that item (its base, label, maker's mark, signature or model number).
Read every marking you can. Decide whether it confirms the identification, changes it, or shows a reproduction or knock-off. Note visible damage (chips, cracks, crazing, repairs) that lowers the price. Then give an updated eBay sold-price estimate in US dollars for used condition, plus "listed" (roughly how many comparable listings are for sale on eBay now) and "sell_through" (chance in percent that one at the typical price sells within about 90 days).

{"verdict":"confirmed","note":"One or two plain sentences on what the markings show and why the price is what it is.","name":"...","details":"...","low":0,"typical":0,"high":0,"confidence":"high","ebay_query":"...","listed":0,"sell_through":0,"verify":null}

  async function runVerify(shot, imgs){

  async function analyze(shot){

  // ---------- capture ----------
  function drawTo(src, w, h, max, q, asData){

  function startFreshIfExample(){

  async function grabFrame(){

      if (it && big) queueVerify(it, [big]);

    }
    if (!aiOn()) { openSettings(true); return; }
    startFreshIfExample();
    const id = uid();
    const [big, thumb] = await Promise.all([drawTo(video, w, h, 1280, .82), drawTo(video, w, h, 160, .6, true)]);
    if (!big) return;
    blobs.set(id, [big]); await putImg(id + ":0", big);

  }
  function toast(msg){

  // ---------- alerts ----------

    try { if (!audio) return; const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain(); o.type = "sine";
      o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + .12);
      g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
      o.connect(g).connect(audio.destination); o.start(); o.stop(t + .45); } catch {}
  }
  function popAlert(it){
    ding();
    const d = demandOf(it);
    const el = document.createElement("div"); el.className = "alert";
    el.innerHTML = `<div class="eyebrow"><i></i>Over your ${money(S.target)} alert${it.verify ? " · authenticate first" : ""}</div>
      <div style="min-width:0"><h4>${esc(it.name)}</h4><div class="where">${esc(it.where)}${d ? ` · ${d.p}% chance to sell` : ""}</div></div>
      <div class="amt tnum">${money(it.typ)}</div>
      <div class="acts"><button class="main" data-a="look">Look</button><a href="${soldUrl(it.q)}" target="_blank" rel="noopener">Sold ↗</a><button data-a="grab">Grab</button><button data-a="close">Dismiss</button></div>`;
    el.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
      if (a === "grab") { it.grab = true; it.pass = false; save(); render(); }
      if (a === "look") openDeck(shotItems(shotOf(it.shot)).sort(SORTS.value).map(i => i.id), it.id);
      el.remove();
    });
    const box = $("#alerts"); box.prepend(el);
    while (box.children.length > 2) box.lastElementChild.remove();
  }

  // ---------- render: shared ----------
  function render(){
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view));
    $("#n-shelves").textContent = shelfShots().length || "";
    $("#n-items").textContent = S.items.length ? S.items.length : "";
    const p = pending().length, st = $("#status");
    st.hidden = !p && !paused;
    st.className = "status" + (paused ? " busy" : "");
    st.innerHTML = paused ? "Busy · tap to retry" : `<span class="spin"></span>Scanning ${p}`;
    const lm = liveMode();
    $("#live").hidden = !lm; $("#main").hidden = lm;
    if (lm) { renderLive(); $("#main").innerHTML = ""; }
    else $("#main").innerHTML = view === "scan" ? scanHTML() : view === "shelves" ? shelvesHTML() : receiptHTML();
    const lt = $("#live-toggle"); lt.classList.toggle("on", !!S.live); lt.textContent = S.live ? "LIVE" : "OFF";
    document.querySelector(".dock .shutter").classList.toggle("closeup", !!closeUpFor);
    renderDetail();
    renderSettings();
  }

  // ---------- render: live camera ----------
  function liveMode(){ return view === "scan" && !S.viewShot; }
  function liveItems(){
    return [...new Set(livePins.map(p => p.id))].map(id => S.items.find(i => i.id === id)).filter(Boolean).sort(SORTS.value);
  }
  function renderLive(){
    if (video.videoWidth) $("#live-frame").style.setProperty("--ar", (video.videoWidth / video.videoHeight).toFixed(4));
    else $("#live-frame").style.setProperty("--ar", "0.75");

      : !aiOn() ? "Add your API key in Settings" : S.live ? "LIVE · hold steady on a shelf" : "Tap the shutter to scan";
    $("#live-prices").textContent = `Alert ${money(S.target)} · Log ${money(S.min)}+`;
    const cover = $("#live-cover");
    if (!stream) {
      cover.hidden = false;
      cover.innerHTML = camStarting ? `<div><span class="spin"></span><div>Starting the camera…</div></div>`

    } else cover.hidden = true;

    const seen = new Set();
    $("#live-pins").innerHTML = livePins.filter(p => { if (seen.has(p.id)) return false; seen.add(p.id); return true; }).map(p => {
      const i = S.items.find(x => x.id === p.id); if (!i) return "";

      return `<button class="pin ${kindOf(i)}${i.pass ? " pass" : ""}" style="left:${p.x}%;top:${p.y}%" data-act="open" data-id="${i.id}" data-deck="${ids}" aria-label="Lot ${lot}: ${esc(i.name)}, ${money(i.typ)}"><span class="lot">LOT ${lot}${i.verify ? " ?" : i.grab ? " ✓" : ""}</span><span class="pv">${money(i.typ)}</span></button>`;
    }).join("");
    const total = its.reduce((a, i) => a + i.typ, 0), all = S.items.reduce((a, i) => a + i.typ, 0);
    const alerts = S.items.filter(i => i.typ >= S.target).length;

    $("#live-list").innerHTML = `
      ${aiOn() ? "" : noAI()}
      ${S.example ? `<div class="note"><strong>An example hunt is loaded</strong> so you can look around: open Shelves and Receipt, and tap any item. Your first scan clears it.</div>` : ""}

      <div class="rows">${its.length ? its.map((i, n) => rowHTML(i, ids, n + 1)).join("")
        : `<div class="empty">${pending().length ? "Finding items and prices…" : `Point at a shelf and hold still. Lot tags appear on anything worth ${money(S.min)} or more.`}</div>`}</div>`;
    if (stream && video.paused) video.play().catch(() => {});
  }

  // ---------- render: a saved shelf (viewfinder replay) ----------
  function curShot(){ return shotOf(S.viewShot) || null; }
  function scanHTML(){
    const s = curShot();
    if (!s) { S.viewShot = null; return ""; }
    const list = shelfShots(), idx = list.indexOf(s);
    const frames = s.frames || 1; frameIdx = clamp(frameIdx, 0, frames - 1);
    const its = shotItems(s).sort(SORTS.value);
    const ids = its.map(i => i.id).join(",");
    const imgU = s.example ? null : imgURL(s.id + ":" + frameIdx);
    const pics = s.example ? exampleScene(s.id) : imgU ? `<img src="${imgU}" alt="${esc(shotTitle(s))}">` : s.thumb ? `<img src="${s.thumb}" alt="">` : "";
    const lotOf = i => its.indexOf(i) + 1;
    const pseen = new Set();
    const pins = shotPins(s).filter(p => (p.frame || 0) === frameIdx && !pseen.has(p.id) && pseen.add(p.id)).map(p => [p, S.items.find(x => x.id === p.id)]).filter(([, i]) => i).map(([p, i]) =>
      `<button class="pin ${kindOf(i)}${i.pass ? " pass" : ""}" style="left:${p.x}%;top:${p.y}%" data-act="open" data-id="${i.id}" data-deck="${ids}" aria-label="Lot ${lotOf(i)}: ${esc(i.name)}, ${money(i.typ)}"><span class="lot">LOT ${lotOf(i)}${i.verify ? " ?" : i.grab ? " ✓" : ""}</span><span class="pv">${money(i.typ)}</span></button>`).join("");
    let overlay = "";
    if (s.status === "working" || s.status === "queued") overlay = `<div class="scanning"><div><span class="spin"></span><div>${esc(s.loading ? s.err : s.status === "queued" ? "Waiting to scan…" : "Finding items and prices…")}</div></div></div>`;
    if (s.status === "error") overlay = `<div class="scanning"><div><div>${esc(s.err || "Scan failed")}</div><br><button data-act="retry" data-shot="${s.id}">Try again</button></div></div>`;
    const total = its.reduce((a,i)=>a+i.typ,0), all = S.items.reduce((a,i)=>a+i.typ,0);
    const alerts = S.items.filter(i => i.typ >= S.target).length;
    return `<section class="stage"><div class="wrap">
      <div class="stage-top"><button class="pill" data-act="live">● Live camera</button><span class="pill strong">${esc(shotTitle(s))}</span><span class="pill">${esc(shotMeta(s))}</span><span class="sp"></span><button class="pill" data-act="settings">Alert ${money(S.target)} · Log ${money(S.min)}+</button></div>
      <div class="frame" style="--ar:${(s.ar || 4/3).toFixed(4)}">${pics}${pins}${overlay}</div>
      <div class="stage-nav">
        <button data-act="shot-step" data-d="-1" ${idx <= 0 ? "disabled" : ""} aria-label="Previous shelf">‹ Prev</button>
        ${frames > 1 ? `<span><button data-act="frame-step" data-d="-1" ${frameIdx <= 0 ? "disabled" : ""} aria-label="Previous frame">‹</button> Frame ${frameIdx+1} of ${frames} <button data-act="frame-step" data-d="1" ${frameIdx >= frames-1 ? "disabled" : ""} aria-label="Next frame">›</button></span>` : `<span>Shelf ${idx+1} of ${list.length}</span>`}
        <button data-act="shot-step" data-d="1" ${idx >= list.length-1 ? "disabled" : ""} aria-label="Next shelf">Next ›</button>
      </div>
    </div></section>
    <section class="wrap shelf">
      ${S.example ? `<div class="note"><strong>This is an example hunt.</strong> Tap a price tag to see the item card. Your first photo clears the examples.</div>` : ""}
      ${s.issue ? `<div class="issue">${esc(s.issue)}</div>` : ""}
      <div class="shelf-head"><div><div class="lbl">This shelf</div><div class="big tnum">${money(total)}</div></div>
        <div class="right"><b>${money(all)}</b> total today<br>${S.items.length} items · ${alerts} alert${alerts===1?"":"s"}</div></div>
      <div class="rows">${its.length ? its.map((i, n) => rowHTML(i, ids, n + 1)).join("") : `<div class="empty">${s.status === "done" ? `Nothing here worth ${money(S.min)} or more.` : "Items show up here as soon as the scan finishes."}</div>`}</div>

  function noAI(){ return `<div class="note"><strong>Add your Claude API key to start scanning.</strong> Get one at console.anthropic.com, then paste it in <button class="pill" data-act="settings" style="background:var(--accent);color:var(--accent-ink)">Settings</button></div>`; }
  function rowHTML(i, ids, lot){

    return `<button class="row ${k}${i.pass ? " passed" : ""}" data-act="open" data-id="${i.id}" data-deck="${ids}">

  }

  // ---------- render: shelves (history) ----------
  function shelvesHTML(){
    const list = shelfShots().slice().reverse();
    const total = S.items.reduce((a,i)=>a+i.typ,0);
    const left = S.items.filter(i => i.typ >= S.target && !i.grab).length;
    if (!list.length) return `<div class="wrap"><div class="empty">No shelves yet. Every photo and video you take is kept here so you can look back later.</div></div>`;
    return `<div class="wrap">
      <div class="list-head"><div><div class="lbl">${list.length} spot${list.length===1?"":"s"} scanned</div><div class="big tnum">${money(total)}</div></div>
        <div class="right">${left ? `<b style="color:var(--accent)">${left} alert${left===1?"":"s"}</b> still on a shelf<br>` : ""}Alert ${money(S.target)} · Log ${money(S.min)}</div></div>
      <div class="cards">${list.map(shelfCard).join("")}</div></div>`;
  }
  function shelfCard(s){
    const its = shotItems(s).sort(SORTS.value), ids = its.map(i => i.id).join(",");
    const missed = its.filter(i => i.typ >= S.target && !i.grab && !i.pass);
    const chips = its.map(i => { const d = demandOf(i), k = i.grab ? "grab" : i.typ >= S.target ? "hit" : i.verify ? "check" : i.pass ? "pass" : "";
      return `<button class="chip ${k}" data-act="open" data-id="${i.id}" data-deck="${ids}">${i.grab ? "✓ " : ""}${esc(shortName(i.name))} ${money(i.typ)}${i.verify ? " ?" : ""}${d ? ` <span class="p">· ${d.p}%</span>` : ""}</button>`; }).join("");
    const kind = s.kind === "video" ? `<span class="kind">${s.parts > 1 ? `VID ${s.part}/${s.parts}` : "VID"}</span>` : "";
    return `<article class="scard${missed.length ? " alerted" : ""}">
      <button class="scard-head" data-act="goto" data-shot="${s.id}">
        <span class="mini">${kind}${thumbHTML(s)}</span>
        <span class="t"><h3>${esc(shotTitle(s))}</h3><span class="m">${esc(shotMeta(s))}</span></span>
        <span class="v tnum">${money(its.reduce((a,i)=>a+i.typ,0))}</span></button>
      ${s.status === "error" ? `<div class="err"><span>${esc(s.err || "Scan failed")}</span><button data-act="retry" data-shot="${s.id}">Try again</button></div>` : ""}
      ${s.issue ? `<div class="issue">${esc(s.issue)}</div>` : ""}
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      ${missed.map(i => { const d = demandOf(i); return `<div class="goback"><span>Go back: ${esc(shortName(i.name))}, ${esc(i.where)}${d ? ` · ${d.p}% sell` : ""}</span><a href="${soldUrl(i.q)}" target="_blank" rel="noopener">Sold ↗</a><a href="${forSaleUrl(i.q)}" target="_blank" rel="noopener">For sale ↗</a></div>`; }).join("")}
    </article>`;
  }
  const shortName = n => { const s = String(n).split(",")[0]; return s.length > 34 ? s.slice(0, 32) + "…" : s; };

  // ---------- render: receipt (full log) ----------
  function receiptHTML(){
    const pass = i => rFilter === "hits" ? i.typ >= S.target : rFilter === "check" ? needsCheck(i) : true;
    const cart = S.items.filter(i => i.grab).sort(SORTS[rSort]);
    const left = S.items.filter(i => !i.grab).sort(SORTS[rSort]);
    const cartV = cart.reduce((a,i)=>a+i.typ,0), fees = cartV * (S.fee||0) / 100, tags = cart.reduce((a,i)=>a+(+i.tag||0),0);
    const missed = left.reduce((a,i)=>a+i.typ,0);
    const best = left.slice().sort(SORTS.bet)[0];
    const checks = S.items.filter(needsCheck).length;
    const p = pending().length;
    const line = (i, deckIds) => { const d = demandOf(i), g = d ? grade(d.p)[0] : "";
      const mark = i.typ >= S.target && !i.grab ? "** " : i.verify ? "?  " : i.pass ? "x  " : "";

      return `<button class="rline ${cls}" data-act="open" data-id="${i.id}" data-deck="${deckIds}"><span class="n">${mark}${esc(shortName(i.name))}</span><span class="s ${g}">${d ? d.p + "%" : "–"}</span><span>${money(i.typ)}</span></button>`; };
    const cartF = cart.filter(pass), leftF = left.filter(pass);
    const cartIds = cartF.map(i => i.id).join(","), leftIds = leftF.map(i => i.id).join(",");
    return `<div class="wrap">
      <div class="rcontrols">
        <div class="seg" role="tablist">
          <button data-act="rfilter" data-f="all" aria-selected="${rFilter==="all"}">All</button>
          <button data-act="rfilter" data-f="hits" aria-selected="${rFilter==="hits"}">Alerts</button>
          <button data-act="rfilter" data-f="check" aria-selected="${rFilter==="check"}">To check${checks ? " " + checks : ""}</button>
        </div>
        <select id="rsort" aria-label="Sort"><option value="value"${rSort==="value"?" selected":""}>Top value</option><option value="bet"${rSort==="bet"?" selected":""}>Best bet</option><option value="sell"${rSort==="sell"?" selected":""}>Sells fastest</option></select>
      </div>
      <div class="paper-wrap"><div class="paper">

        ${p ? `<div class="sub" style="color:var(--check)">STILL SCANNING ${p} · TOTALS WILL UPDATE</div>` : ""}
        <hr>
        <div class="sec"><span>IN CART</span><span>SELL</span><span>VALUE</span></div>
        ${cartF.length ? cartF.map(i => line(i, cartIds)).join("") : `<div class="none">${cart.length ? "None match this filter" : "Nothing grabbed yet"}</div>`}
        ${tags ? `<div class="tline m"><span>  tag prices paid</span><span>-${money(tags)}</span></div>` : ""}
        <hr>
        <div class="sec"><span>LEFT ON THE SHELF</span><span></span><span></span></div>
        ${leftF.length ? leftF.map(i => line(i, leftIds)).join("") : `<div class="none">${left.length ? "None match this filter" : "Nothing left behind"}</div>`}
        <hr>
        <div class="tline"><span>CART VALUE</span><span>${money(cartV)}</span></div>
        <div class="tline"><span>EBAY FEES ${S.fee}%</span><span>-${money(fees)}</span></div>
        ${tags ? `<div class="tline"><span>TAG PRICES</span><span>-${money(tags)}</span></div>` : ""}
        <div class="tline b"><span>NET PROFIT</span><span>${money(cartV - fees - tags)}</span></div>
        <div class="tline miss"><span>MISSED</span><span>${money(missed)}</span></div>
        ${best ? `<div class="tline m"><span>BEST BET LEFT</span><span>${esc(shortName(best.name).slice(0,16))} ${money(best.typ)} @ ${sp(best)}%</span></div>` : ""}
        <div class="legend">** over alert · ? authenticate · x passed<br>SELL = chance to sell within 90 days. Tap any line for details.</div>
      </div></div></div>`;
  }

  // ---------- item card (swipe deck) ----------
  function openDeck(ids, id){
    ids = ids.filter(x => S.items.some(i => i.id === x));
    if (!ids.length) return;
    deck = { ids, idx: Math.max(0, ids.indexOf(id)) };
    render(); $("#detail").scrollTop = 0;
  }
  function closeDeck(){ deck = null; render(); }
  function renderDetail(){
    const el = $("#detail");
    if (!deck) { el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    const n = deck.ids.length;
    const top = (label) => `<div class="dtop"><button class="back" data-act="close-deck">← Back</button><span class="count">${label}</span></div>
      <div class="progress"><i style="width:${Math.round(100 * Math.min(deck.idx + 1, n) / n)}%"></i></div>`;
    if (deck.idx >= n) {
      el.innerHTML = `<div class="wrap">${top(`${n} of ${n}`)}<div class="dend"><b>That's the pile</b><span class="muted">You've gone through every item here.</span><button data-act="close-deck">Back to the list</button></div></div>`;
      return;
    }
    const it = S.items.find(i => i.id === deck.ids[deck.idx]);
    if (!it) { deck.idx++; return renderDetail(); }
    const s = shotOf(it.shot), d = demandOf(it), dup = dupOf(it), v = it.verified;
    const [gcls, gword] = d ? grade(d.p) : ["",""];
    // zoomed crop centered on the item
    const x = it.x ?? 50, y = it.y ?? 50, scale = it.x == null ? 1 : 2.3;
    const ar = s?.ar || 4/3;
    let pic = "";

    else { const u = s ? imgURL(s.id + ":" + (it.frame || 0)) : null; pic = u ? `<img src="${u}" alt="">` : s?.thumb ? `<img src="${s.thumb}" alt="">` : ""; }
    const tags = [
      it.typ >= S.target ? `<span class="hit">Over ${money(S.target)} alert</span>` : "",
      it.grab ? `<span class="grab">In cart</span>` : it.pass ? `<span>Passed</span>` : "",
      v ? `<span class="${v.verdict === "reproduction" ? "fake" : v.verdict === "unclear" ? "check" : "hit"}">${VLABEL[v.verdict]}</span>` : it.verify ? `<span class="check">Authenticate</span>` : "",
      `<span>${it.conf} confidence</span>`
    ].join("");
    const n2 = it.tag == null ? null : it.typ * (1 - (S.fee||0)/100) - (+it.tag||0);
    el.innerHTML = `<div class="wrap">
      ${top(`${deck.idx + 1} of ${n}`)}
      <div class="deckwrap">${deck.idx < n - 1 ? '<div class="ghost"></div>' : ""}
      <article class="dcard" id="dcard">
        <div class="stamp grab">GRAB</div><div class="stamp pass">PASS</div>
        <div class="zoom"><div class="ztag">${tags}</div>
          <div class="zin" style="transform:translate(-${x}%,-${y}%) scale(${scale});transform-origin:${x}% ${y}%">${pic}</div></div>
        <div class="dbody">
          <div class="lotlabel">LOT ${Math.max(1, shotItems(shotOf(it.shot)).sort(SORTS.value).indexOf(it) + 1)}${s ? " · " + esc(shotTitle(s)).toUpperCase() : ""}</div>
          <div class="dname"><h2>${esc(it.name)}</h2><div class="amt tnum ${it.typ >= S.target ? "hit" : ""}">${money(it.typ)}</div></div>
          <div class="dmeta">Sold for ${money(it.low)}–${money(it.high)} · ${esc(it.where)}${it.details ? `<br>${esc(it.details)}` : ""}</div>
          ${d ? `<div class="odds ${gcls}">
            <div class="ohead"><span>Chance to sell in 90 days</span><b class="tnum">${d.p}%</b></div>
            <div class="bar"><i class="fill" style="width:${d.p}%"></i></div>
            <div class="stats"><span><b class="tnum">${d.sold != null ? (d.real ? "" : "~") + d.sold.toLocaleString("en-US") : "–"}</b>sold</span><span><b class="tnum">${d.listed != null ? (d.real ? "" : "~") + d.listed.toLocaleString("en-US") : "–"}</b>for sale now</span><span><b class="g">${gword}</b>${d.real ? "your count" : "estimate"}</span></div>
            ${it.showCounts ? `<div class="counts-form"><span style="width:100%">Open <b>Sold</b> and <b>For sale</b> below and type the result counts eBay shows.</span>
              <label for="rs">Sold</label><input id="rs" data-a="rsold" type="number" inputmode="numeric" min="0" value="${it.realSold ?? ""}">
              <label for="rl">For sale</label><input id="rl" data-a="rlisted" type="number" inputmode="numeric" min="0" value="${it.realListed ?? ""}"></div>`
              : `<div class="foot"><span>${d.real ? "From the counts you entered." : "Claude's estimate."}</span><button data-act="counts">${d.real ? "Edit counts" : "Enter real counts"}</button></div>`}
          </div>` : ""}
          ${it.checking ? `<div class="flag"><p>Checking your close-up…</p></div>` : it.verify ? `<div class="flag"><p><b>Authenticate:</b> ${esc(it.verify.ask)}</p><button data-act="verify">Take close-up</button><button class="plain" data-act="skipverify">Skip</button></div>` : ""}
          ${dup ? `<div class="flag dup"><p>Looks like the same item as <b>${esc(shortName(dup.name))}</b> (${money(dup.typ)}) from another shelf.</p><button data-act="merge" data-o="${dup.id}">Merge</button><button class="plain" data-act="keepboth">Keep both</button></div>` : ""}
          ${v?.note ? `<div class="vnote${v.verdict === "reproduction" ? " fake" : ""}"><b>${VLABEL[v.verdict]}:</b> ${esc(v.note)}</div>` : ""}
          <div class="dlinks">
            <a class="sold" href="${soldUrl(it.q)}" target="_blank" rel="noopener">Sold ↗</a>
            <a class="forsale" href="${forSaleUrl(it.q)}" target="_blank" rel="noopener">For sale ↗</a>
            <label class="tagin" for="tagp">Tag $<input id="tagp" data-a="tag" type="number" inputmode="decimal" min="0" step="0.5" value="${it.tag ?? ""}" placeholder="0"></label>
            ${n2 == null ? "" : `<span class="net ${n2 >= 0 ? "pos" : "neg"}">${n2 >= 0 ? "+" : "−"}${money(Math.abs(n2))} net</span>`}
          </div>
        </div>
      </article></div>
      <div class="dacts">
        <button class="pass${it.pass ? " on" : ""}" data-act="pass" aria-label="Pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="ver" data-act="verify" aria-label="Take a close-up to verify"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></button>
        <button class="grab${it.grab ? " on" : ""}" data-act="grab" aria-label="Grab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      </div>
      <div class="dhint">Swipe right to grab, left to pass</div>
      <button class="dremove" data-act="del">Remove this item</button>
    </div>`;
  }
  function decide(kind){
    const it = deck && S.items.find(i => i.id === deck.ids[deck.idx]); if (!it) return;
    if (kind === "grab") { it.grab = true; it.pass = false; } else { it.pass = true; it.grab = false; }
    save(); deck.idx++; render(); $("#detail").scrollTop = 0;
  }
  // swipe gestures
  let drag = null;
  document.addEventListener("pointerdown", e => {
    const c = e.target.closest("#dcard"); if (!c || e.target.closest("input,a,button,select,label")) return;
    drag = { x:e.clientX, y:e.clientY, dx:0, on:false, el:c, id:e.pointerId };
  });
  document.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) { if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { drag.on = true; drag.el.classList.add("dragging"); try { drag.el.setPointerCapture(e.pointerId); } catch {} } else return; }
    drag.dx = dx;
    drag.el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    drag.el.querySelector(".stamp.grab").style.opacity = clamp(dx / 100, 0, 1);
    drag.el.querySelector(".stamp.pass").style.opacity = clamp(-dx / 100, 0, 1);
  });
  function endDrag(){
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.on) return;
    d.el.classList.remove("dragging");
    if (Math.abs(d.dx) > 90) {
      d.el.style.transform = `translateX(${d.dx > 0 ? 600 : -600}px) rotate(${d.dx > 0 ? 20 : -20}deg)`;
      setTimeout(() => decide(d.dx > 0 ? "grab" : "pass"), 170);
    } else {
      d.el.style.transform = "";
      d.el.querySelectorAll(".stamp").forEach(s => s.style.opacity = 0);
    }
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  // ---------- settings ----------
  function renderSettings(){
    if ($("#settings").hidden) return;
    if (document.activeElement !== $("#target")) $("#target").value = S.target;
    if (document.activeElement !== $("#minlog")) $("#minlog").value = S.min;
    $("#fee").value = S.fee; $("#careful").checked = !!S.careful; $("#livechk").checked = !!S.live; if (document.activeElement !== $("#apikey")) $("#apikey").value = S.key || ""; $("#key-need").hidden = aiOn();
    $("#target-chips").innerHTML = [25,50,75,100,150,250].map(v => `<button data-act="chip" data-k="target" data-v="${v}" aria-pressed="${+S.target===v}">$${v}</button>`).join("");
    $("#min-chips").innerHTML = [0,5,10,15,20,30].map(v => `<button data-act="chip" data-k="min" data-v="${v}" aria-pressed="${+S.min===v}">${v ? "$" + v : "Log all"}</button>`).join("");
  }
  const openSettings = on => { $("#settings").hidden = !on; $("#overlay").hidden = !on; $("#confirm-new").hidden = true; render(); };

  // ---------- events ----------
  document.addEventListener("click", e => {
    const tab = e.target.closest(".tabs button"); if (tab) { view = tab.dataset.view; if (view === "scan") S.viewShot = null; deck = null; render(); window.scrollTo(0, 0); if (view === "scan" && camWanted()) startCamera(); return; }
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act;
    const cur = deck && S.items.find(i => i.id === deck.ids[deck.idx]);
    switch (a) {
      case "open": openDeck((t.dataset.deck || t.dataset.id).split(","), t.dataset.id); break;
      case "close-deck": closeDeck(); break;
      case "grab": decide("grab"); break;
      case "pass": decide("pass"); break;
      case "verify": if (cur) startVerify(cur.id); break;
      case "skipverify": if (cur) { cur.verify = null; save(); render(); } break;
      case "keepboth": if (cur) { cur.dupOk = true; save(); render(); } break;
      case "counts": if (cur) { cur.showCounts = !cur.showCounts; save(); render(); } break;
      case "del": if (cur) { S.items = S.items.filter(i => i !== cur); deck.ids.splice(deck.idx, 1); save(); if (!deck.ids.length) deck = null; render(); } break;
      case "merge": if (cur) {
        const o = S.items.find(i => i.id === t.dataset.o);
        if (o) { const rank = { high:3, medium:2, low:1 };
          const [keep, drop] = (rank[cur.conf]||0) > (rank[o.conf]||0) || cur.verified ? [cur, o] : [o, cur];
          keep.grab = keep.grab || drop.grab; if (keep.tag == null) keep.tag = drop.tag;
          if (!keep.verified && drop.verified) { keep.verified = drop.verified; keep.verify = null; }
          S.items = S.items.filter(i => i !== drop);
          const di = deck.ids.indexOf(drop.id); if (di >= 0) { deck.ids.splice(di, 1); if (di < deck.idx) deck.idx--; }
          if (!deck.ids.includes(keep.id)) deck.ids.splice(deck.idx, 0, keep.id);
        }
        save(); render(); } break;
      case "retry": retry(shotOf(t.dataset.shot)); break;
      case "retry-all": paused = false; S.shots.filter(s => s.status === "error" && blobs.has(s.id)).forEach(s => s.status = "queued"); pump(); render(); break;
      case "goto": S.viewShot = t.dataset.shot; frameIdx = 0; view = "scan"; save(); render(); window.scrollTo(0, 0); break;
      case "shot-step": { const list = shelfShots(), i = list.indexOf(curShot()) + +t.dataset.d; if (list[i]) { S.viewShot = list[i].id; frameIdx = 0; save(); render(); } } break;
      case "live": S.viewShot = null; save(); render(); startCamera(); window.scrollTo(0, 0); break;
      case "cam-start": unlockAudio(); startCamera(); break;
      case "shutter": unlockAudio(); view = "scan"; S.viewShot = null; if (!stream) { render(); startCamera(); } else captureNow = true; render(); break;
      case "live-toggle": S.live = !S.live; save(); render(); break;
      case "frame-step": frameIdx += +t.dataset.d; render(); break;
      case "rfilter": rFilter = t.dataset.f; render(); break;
      case "done": view = "receipt"; deck = null; render(); window.scrollTo(0, 0); break;
      case "settings": openSettings(true); break;
      case "close-settings": openSettings(false); break;
      case "chip": S[t.dataset.k] = +t.dataset.v; save(); render(); break;
      case "new-hunt": $("#confirm-new").hidden = false; break;
      case "new-no": $("#confirm-new").hidden = true; break;
      case "new-yes": {
        const keep = { target:S.target, min:S.min, fee:S.fee, careful:S.careful, live:S.live, key:S.key };
        S = { example:false, ...keep, shots:[], items:[], viewShot:null }; blobs.clear(); paused = false; deck = null; view = "scan"; livePins = []; liveShot = null; lastScanGrid = null;
        clearImgs(); save(); openSettings(false); } break;
    }
  });
  document.addEventListener("change", e => {
    const t = e.target, cur = deck && S.items.find(i => i.id === deck.ids[deck.idx]);
    if (t.id === "rsort") { rSort = t.value; render(); return; }
    if (t.id === "target") { S.target = Math.max(1, +t.value || 100); save(); render(); return; }
    if (t.id === "minlog") { S.min = Math.max(0, +t.value || 0); save(); render(); return; }
    if (t.id === "fee") { S.fee = clamp(+t.value || 0, 0, 40); save(); render(); return; }
    if (t.id === "apikey") { S.key = t.value.trim(); paused = false; save(); render(); pump(); return; }
    if (t.id === "livechk") { S.live = t.checked; save(); render(); return; }
    if (t.id === "careful") { S.careful = t.checked; save(); return; }
    if (!cur) return;
    const a = t.dataset.a;
    if (a === "tag") { cur.tag = t.value === "" ? null : Math.max(0, +t.value); save(); render(); }
    if (a === "rsold" || a === "rlisted") {
      const v = t.value === "" ? null : cnt(t.value);
      if (a === "rsold") cur.realSold = v; else cur.realListed = v;
      if (cur.realSold != null && cur.realListed != null) cur.showCounts = false;
      save(); render();
      const next = document.getElementById(a === "rsold" ? "rl" : "rs");
      if (next && next.value === "") next.focus();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (!$("#settings").hidden) openSettings(false); else if (deck) closeDeck(); }
    if (deck && !e.target.closest("input,select") && (e.key === "ArrowRight" || e.key === "ArrowLeft")) decide(e.key === "ArrowRight" ? "grab" : "pass");
  });

  // Scans still pending from an earlier visit can't be resent (full images aren't kept between visits).
  S.shots = S.shots.filter(s => !s.loading);
  S.shots.forEach(s => { if (s.status === "queued" || s.status === "working") { s.status = "error"; s.err = "Retake this one"; } });
  S.items.forEach(i => { i.checking = false; });
  S.viewShot = null;
  render();
  if (camWanted()) startCamera();
})();
</script>
</body>
</html>

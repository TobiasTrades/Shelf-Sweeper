name: Build Shelf Sweeper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShelfSweeper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShelfSweeper
          path: ShelfSweeper.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelf Sweeper (build ${{ github.run_number }})
          body: Install ShelfSweeper.apk on your Android phone. Each new build installs over the last one and keeps your data.
          files: ShelfSweeper.apk
          make_latest: true
